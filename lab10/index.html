<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>M/M/c/K/N Queue Simulation</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="app-layout">
            <header class="navbar">
                <div class="brand">
                    <div class="logo">Q</div>
                    <div>
                        <h1>M/M/c/K/N Simulator</h1>
                        <p>Advanced discrete-event queueing model</p>
                    </div>
                </div>
                <div class="nav-actions">
                    <button id="export-csv" class="btn btn-outline">
                        CSV Export
                    </button>
                    <button id="export-log" class="btn btn-outline">
                        Event Log
                    </button>
                </div>
            </header>

            <section class="config-panel">
                <div class="config-row presets-row">
                    <h3>Presets</h3>
                    <div id="scenario-grid" class="scenario-track"></div>
                </div>

                <div class="params-grid">
                    <div class="param-group">
                        <h4>Arrival & Service</h4>
                        <div class="input-wrap">
                            <label for="lambda">Arrival Rate (λ)</label>
                            <input
                                type="number"
                                id="lambda"
                                value="1.4"
                                min="0.0001"
                                step="0.05"
                            />
                        </div>
                        <div class="input-wrap">
                            <label for="mu">Service Rate (μ)</label>
                            <input
                                type="number"
                                id="mu"
                                value="0.65"
                                min="0.0001"
                                step="0.05"
                            />
                        </div>
                        <div class="input-wrap">
                            <label for="servers">Operators (c)</label>
                            <input
                                type="number"
                                id="servers"
                                value="3"
                                min="1"
                                step="1"
                            />
                        </div>
                    </div>

                    <div class="param-group">
                        <h4>System Constraints</h4>
                        <div class="input-wrap">
                            <label for="capacity">Capacity (K)</label>
                            <input
                                type="number"
                                id="capacity"
                                value="18"
                                min="1"
                                step="1"
                            />
                        </div>
                        <div class="input-wrap">
                            <label for="source-population"
                                >Population (N) <small>(0 = ∞)</small></label
                            >
                            <input
                                type="number"
                                id="source-population"
                                value="0"
                                min="0"
                                step="1"
                            />
                        </div>
                        <div class="input-wrap">
                            <label for="long-wait">Long Wait Threshold</label>
                            <input
                                type="number"
                                id="long-wait"
                                value="10"
                                min="0"
                                step="0.5"
                            />
                        </div>
                    </div>

                    <div class="param-group">
                        <h4>Complications</h4>
                        <div class="input-wrap">
                            <label for="patience">Mean Patience</label>
                            <input
                                type="number"
                                id="patience"
                                value="8"
                                min="0.01"
                                step="0.5"
                            />
                        </div>
                        <div class="input-group-row">
                            <div class="input-wrap">
                                <label for="resource-min">Res. Min</label>
                                <input
                                    type="number"
                                    id="resource-min"
                                    value="1"
                                    min="1"
                                    step="1"
                                />
                            </div>
                            <div class="input-wrap">
                                <label for="resource-max">Res. Max</label>
                                <input
                                    type="number"
                                    id="resource-max"
                                    value="2"
                                    min="1"
                                    step="1"
                                />
                            </div>
                        </div>
                        <div class="input-wrap">
                            <label for="resource-capacity"
                                >Total Resource Capacity</label
                            >
                            <input
                                type="number"
                                id="resource-capacity"
                                value="5"
                                min="1"
                                step="1"
                            />
                        </div>
                    </div>

                    <div class="param-group">
                        <h4>Engine Settings</h4>
                        <div class="input-wrap">
                            <label>Observation Time (T)</label>
                            <div class="chip-group" data-input="observation">
                                <button class="chip-btn" data-value="480">
                                    480
                                </button>
                                <button
                                    class="chip-btn active"
                                    data-value="1440"
                                >
                                    1440
                                </button>
                                <button class="chip-btn" data-value="5000">
                                    5k
                                </button>
                            </div>
                            <input
                                type="hidden"
                                id="observation"
                                value="1440"
                            />
                            <input
                                type="number"
                                id="observation-custom"
                                placeholder="Custom T"
                                class="mt-2"
                            />
                        </div>
                        <div class="input-group-row mt-2">
                            <div class="input-wrap">
                                <label for="warmup">Warm-up</label>
                                <input
                                    type="number"
                                    id="warmup"
                                    value="120"
                                    min="0"
                                    step="10"
                                />
                            </div>
                            <div class="input-wrap">
                                <label for="log-limit">Log Limit</label>
                                <input
                                    type="number"
                                    id="log-limit"
                                    value="260"
                                    min="20"
                                    step="20"
                                />
                            </div>
                        </div>
                        <div class="input-wrap mt-2 with-btn">
                            <label for="seed">RNG Seed</label>
                            <div class="flex-row">
                                <input type="number" id="seed" value="41010" />
                                <button
                                    id="random-seed"
                                    class="btn-icon"
                                    title="Randomize"
                                >
                                    🎲
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="action-bar">
                <div id="alert" class="alert"></div>
                <div class="action-buttons">
                    <button id="compare-scenarios" class="btn btn-secondary">
                        Compare All Presets
                    </button>
                    <button id="run-simulation" class="btn btn-primary">
                        Run Simulation
                    </button>
                </div>
            </div>

            <main class="main-content">
                <div id="results">
                    <div class="empty-state">
                        <div class="icon">📊</div>
                        <h2>Awaiting Simulation</h2>
                        <p>
                            Adjust parameters above and click Run to generate
                            metrics and charts.
                        </p>
                    </div>
                </div>
            </main>
        </div>

        <script src="scenarios.js"></script>
        <script src="sim_utils.js"></script>
        <script src="simulation.js"></script>
        <script src="charts.js"></script>
        <script src="render.js"></script>
        <script src="ui.js"></script>
    </body>
</html>
